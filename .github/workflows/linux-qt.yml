name: Linux Qt verification
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
concurrency:
  group: qt-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      profile: ${{ steps.scope.outputs.profile }}
      syntax: ${{ steps.scope.outputs.syntax }}
      math: ${{ steps.scope.outputs.math }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: targets
        run: |
          echo "matrix=$(python3 scripts/ci-toolchain/qt_versions.py --matrix)" >> "$GITHUB_OUTPUT"
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FORCE_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          options=()
          [[ "$FORCE_FULL" == true ]] && options+=(--force-full)
          python3 scripts/ci-toolchain/check-scope.py --base "$BASE_SHA" "${options[@]}" > scope.json
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json
          for key, value in json.load(open('scope.json')).items():
              print(f"{key}={str(value).lower()}")
          PYCODE
      - name: Install YAML validator
        run: python3 -m pip install PyYAML==6.0.3
      - name: Lightweight verification
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check.py --base "$BASE_SHA"
  packaging:
    name: packaging (${{ matrix.role }})
    needs: targets
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ needs.targets.outputs.profile == 'full' && 75 || 50 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix || '{"include":[{"role":"minimum","qt":"unavailable"},{"role":"development","qt":"unavailable"}]}') }}
    steps:
      - name: Require successful initial verification
        env:
          INITIAL_RESULT: ${{ needs.targets.result }}
        run: test "$INITIAL_RESULT" = success
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Light profile
        if: needs.targets.outputs.profile == 'light'
        run: echo "Qt verification unnecessary; initial lightweight checks passed."
      - name: Resolve toolchain identity
        if: needs.targets.outputs.profile != 'light'
        id: toolchain
        env:
          CI_QT_VERSION: ${{ matrix.qt }}
        run: |
          mkdir -p "$RUNNER_TEMP/qmarkdown-image"
          date +%s > "$RUNNER_TEMP/qmarkdown-image/started.txt"
          python3 scripts/run-ci.py --qt "$CI_QT_VERSION" --image-metadata > "$RUNNER_TEMP/qmarkdown-image/metadata.json"
          python3 - "$RUNNER_TEMP/qmarkdown-image/metadata.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          for key, value in json.load(open(sys.argv[1])).items():
              print(f"{key}={value}")
          PY
      - name: Restore compiler cache
        if: needs.targets.outputs.profile != 'light'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/qmarkdown-ccache
          key: ccache-${{ steps.toolchain.outputs.recipeFingerprint }}-${{ github.run_id }}
          restore-keys: ccache-${{ steps.toolchain.outputs.recipeFingerprint }}-
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        if: needs.targets.outputs.profile != 'light'
        with:
          # Bootstrap without the Docker Hub authentication endpoint.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Prepare toolchain image
        if: needs.targets.outputs.profile != 'light'
        id: image
        timeout-minutes: 20
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: scripts/ci-toolchain
          platforms: ${{ steps.toolchain.outputs.platform }}
          build-args: CI_QT_VERSION=${{ matrix.qt }}
          tags: ${{ steps.toolchain.outputs.tag }}
          load: true
          push: false
          cache-from: type=gha,version=2,scope=qmarkdown-qt-${{ matrix.qt }}-amd64
          cache-to: type=gha,version=2,scope=qmarkdown-qt-${{ matrix.qt }}-amd64,mode=max,ignore-error=true
      - name: Record hosted image preparation
        if: always() && needs.targets.outputs.profile != 'light'
        env:
          IMAGE_METADATA: ${{ steps.image.outputs.metadata }}
          IMAGE_ID: ${{ steps.image.outputs.imageid }}
          IMAGE_OUTCOME: ${{ steps.image.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/qmarkdown-image"
          python3 - "$RUNNER_TEMP/qmarkdown-image/build.json" <<'PY'
          import json, os, sys, time
          from pathlib import Path
          with open(sys.argv[1], "w") as output:
              evidence = {key: os.environ[key] for key in ("IMAGE_METADATA", "IMAGE_ID", "IMAGE_OUTCOME")}
              started = Path(sys.argv[1]).with_name("started.txt")
              if started.exists():
                  evidence["preparationSeconds"] = round(time.time() - float(started.read_text()), 3)
              json.dump(evidence, output, indent=2)
          PY
      - name: Shared/static verification and benchmark smoke
        if: needs.targets.outputs.profile != 'light'
        env:
          CI_QT_VERSION: ${{ matrix.qt }}
        run: |
          options=()
          [[ "${{ needs.targets.outputs.syntax }}" == true ]] && options+=(--syntax)
          [[ "${{ needs.targets.outputs.math }}" == true ]] && options+=(--math)
          QMARKDOWN_CCACHE_DIR="$RUNNER_TEMP/qmarkdown-ccache" python3 scripts/run-ci.py --qt "$CI_QT_VERSION" --profile "${{ needs.targets.outputs.profile }}" "${options[@]}" --artifact-dir "$RUNNER_TEMP/qmarkdown-ci"
      - name: Retain available verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qt-${{ matrix.qt }}-verification-evidence
          path: |
            ${{ runner.temp }}/qmarkdown-image/**
            ${{ runner.temp }}/qmarkdown-ci/*.log
            ${{ runner.temp }}/qmarkdown-ci/*.json
            ${{ runner.temp }}/qmarkdown-ci/*.txt
            ${{ runner.temp }}/qmarkdown-ci/os-release
            ${{ runner.temp }}/qmarkdown-ci/packaging-*/**/Testing/Temporary/*.log
            ${{ runner.temp }}/qmarkdown-ci/packaging-*/**/commonmark-report.json
            ${{ runner.temp }}/qmarkdown-ci/packaging-*/**/CMakeConfigureLog.yaml
            ${{ runner.temp }}/qmarkdown-ci/math-off-*/**/Testing/Temporary/*.log
            ${{ runner.temp }}/qmarkdown-ci/math-off-*/**/CMakeConfigureLog.yaml
            ${{ runner.temp }}/qmarkdown-ci/benchmarks/benchmark.json
          if-no-files-found: ignore
          retention-days: 14
  release-gate:
    needs: [targets, packaging]
    if: needs.targets.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Record tested release inputs
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PYCODE'
          import json, os, re, subprocess
          from pathlib import Path
          gate = {'schema': 'qmarkdown-ci-v2', 'profile': 'full', 'full': True, 'pr': int(os.environ['PR_NUMBER']), 'head': os.environ['PR_HEAD'],
                  'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                  'qt': json.loads(Path('scripts/ci-toolchain/qt-versions.json').read_text()),
                  'version': re.search(r'project\(QMarkdown VERSION (\d+\.\d+\.\d+)', Path('CMakeLists.txt').read_text())[1]}
          Path('gate.json').write_text(json.dumps(gate) + '\n')
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-gate
          path: gate.json
          retention-days: 90
