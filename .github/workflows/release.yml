name: Publish verified release
on:
  workflow_dispatch:
    inputs:
      release_pr:
        description: Merged release PR number whose final full CI run passed
        required: true
        type: number
permissions:
  contents: read
  actions: read
concurrency:
  group: qmarkdown-publication
  cancel-in-progress: false
jobs:
  eligible:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.inputs.outputs.commit }}
      version: ${{ steps.inputs.outputs.version }}
      matrix: ${{ steps.inputs.outputs.matrix }}
    steps:
      - name: Resolve merged release commit
        id: merged
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.release_pr }}
        run: echo "commit=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR" --jq .merge_commit_sha)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.merged.outputs.commit }}
          fetch-depth: 0
      - name: Check final PR verification and unchanged main
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.release_pr }}
        run: |
          python3 scripts/release/eligibility.py --repository "$GITHUB_REPOSITORY" --pr "$RELEASE_PR" --output eligibility.json
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          for key, value in json.loads(Path('eligibility.json').read_text()).items():
              print(f'{key}={value}')
          PYCODE
          echo "matrix=$(python3 scripts/ci-toolchain/qt_versions.py --matrix)" >> "$GITHUB_OUTPUT"
          python3 scripts/check-docs.py
      - name: Build exact-commit source distribution
        run: python3 scripts/build-source-archive.py --source-commit HEAD --work-dir release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-distribution
          path: release-assets/*
          if-no-files-found: error
  source-check:
    needs: eligible
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.eligible.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.eligible.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: source-distribution
          path: release-assets
      - name: Resolve toolchain identity
        id: toolchain
        env:
          CI_QT_VERSION: ${{ matrix.qt }}
        run: |
          mkdir -p "$RUNNER_TEMP/qmarkdown-image"
          date +%s > "$RUNNER_TEMP/qmarkdown-image/started.txt"
          python3 scripts/run-ci.py --qt "$CI_QT_VERSION" --image-metadata > "$RUNNER_TEMP/qmarkdown-image/metadata.json"
          python3 - "$RUNNER_TEMP/qmarkdown-image/metadata.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          for key, value in json.load(open(sys.argv[1])).items():
              print(f"{key}={value}")
          PY
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          # Bootstrap without the Docker Hub authentication endpoint.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Prepare toolchain image
        id: image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: scripts/ci-toolchain
          platforms: ${{ steps.toolchain.outputs.platform }}
          build-args: CI_QT_VERSION=${{ matrix.qt }}
          tags: ${{ steps.toolchain.outputs.tag }}
          load: true
          push: false
          cache-from: type=gha,version=2,scope=qmarkdown-qt-${{ matrix.qt }}-amd64
          cache-to: type=gha,version=2,scope=qmarkdown-qt-${{ matrix.qt }}-amd64,mode=max,ignore-error=true
      - name: Build and install extracted library distribution
        env:
          IMAGE_TAG: ${{ steps.toolchain.outputs.tag }}
          CI_QT_VERSION: ${{ matrix.qt }}
          VERSION: ${{ needs.eligible.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/source-check"
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/source-check,dst=/checks" \
            --env CI_QT_VERSION="$CI_QT_VERSION" --env VERSION="$VERSION" "$IMAGE_TAG" bash -euc '
              python3 /source/scripts/verify-source-archive.py --archive "/source/release-assets/qmarkdown-$VERSION.tar.gz" \
                --qt-root "/opt/Qt/$CI_QT_VERSION/gcc_64" --work-dir /checks/results
            '
  arch:
    needs: eligible
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.eligible.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: source-distribution
          path: release-assets
      - name: Focused Arch distribution checks
        env:
          VERSION: ${{ needs.eligible.outputs.version }}
        run: python3 scripts/build-arch-package.py --source-archive "release-assets/qmarkdown-$VERSION.tar.gz" --work-dir "$RUNNER_TEMP/qmarkdown-arch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arch-distribution
          path: ${{ runner.temp }}/qmarkdown-arch/*.pkg.tar.zst*
          if-no-files-found: error
  publish:
    needs: [eligible, source-check, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.eligible.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-distribution'
          merge-multiple: true
          path: release-assets
      - name: Tag, upload draft, publish and verify downloaded hashes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.release_pr }}
        run: python3 scripts/release/publish.py --repository "$GITHUB_REPOSITORY" --pr "$RELEASE_PR" --assets release-assets
