name: Stable release package
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        qt: ['6.8.0', '6.11.3']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          fetch-depth: 0
      - name: Validate release source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/qmarkdown-image"
          printf 'tag=%s\ncommit=%s\n' "$RELEASE_TAG" "$(git rev-parse HEAD)" > "$RUNNER_TEMP/qmarkdown-image/validation.txt"
          if [ -n "$RELEASE_TAG" ]; then
            python3 - "$RELEASE_TAG" <<'PYCODE'
          import re, sys
          from pathlib import Path
          version = re.search(r'project\(QMarkdown VERSION (\d+\.\d+\.\d+)', Path('CMakeLists.txt').read_text())[1]
          if sys.argv[1] != 'v' + version:
              raise SystemExit('Release tag must match CMake project version vX.Y.Z')
          PYCODE
            git merge-base --is-ancestor HEAD origin/main
          fi
      - name: Resolve toolchain identity
        id: toolchain
        env:
          CI_QT_VERSION: ${{ matrix.qt }}
        run: |
          mkdir -p "$RUNNER_TEMP/qmarkdown-image"
          date +%s > "$RUNNER_TEMP/qmarkdown-image/started.txt"
          python3 scripts/run-ci.py --qt "$CI_QT_VERSION" --image-metadata > "$RUNNER_TEMP/qmarkdown-image/metadata.json"
          python3 - "$RUNNER_TEMP/qmarkdown-image/metadata.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          for key, value in json.load(open(sys.argv[1])).items():
              print(f"{key}={value}")
          PY
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          # Bootstrap without the Docker Hub authentication endpoint.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Prepare toolchain image
        id: image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: scripts/ci-toolchain
          platforms: ${{ steps.toolchain.outputs.platform }}
          build-args: CI_QT_VERSION=${{ matrix.qt }}
          tags: ${{ steps.toolchain.outputs.tag }}
          load: true
          push: false
          cache-from: type=gha,version=2,scope=qmarkdown-qt-${{ matrix.qt }}-amd64
          cache-to: type=gha,version=2,scope=qmarkdown-qt-${{ matrix.qt }}-amd64,mode=max,ignore-error=true
      - name: Record hosted image preparation
        if: always()
        env:
          IMAGE_METADATA: ${{ steps.image.outputs.metadata }}
          IMAGE_ID: ${{ steps.image.outputs.imageid }}
          IMAGE_OUTCOME: ${{ steps.image.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/qmarkdown-image"
          python3 - "$RUNNER_TEMP/qmarkdown-image/build.json" <<'PY'
          import json, os, sys, time
          from pathlib import Path
          with open(sys.argv[1], "w") as output:
              evidence = {key: os.environ[key] for key in ("IMAGE_METADATA", "IMAGE_ID", "IMAGE_OUTCOME")}
              started = Path(sys.argv[1]).with_name("started.txt")
              if started.exists():
                  evidence["preparationSeconds"] = round(time.time() - float(started.read_text()), 3)
              json.dump(evidence, output, indent=2)
          PY
      - name: Ubuntu container packaging and benchmark smoke
        env:
          CI_QT_VERSION: ${{ matrix.qt }}
        run: python3 scripts/run-ci.py --qt "$CI_QT_VERSION" --artifact-dir "$RUNNER_TEMP/qmarkdown-ci"
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qt-${{ matrix.qt }}-failure-evidence
          path: |
            ${{ runner.temp }}/qmarkdown-image/**
            ${{ runner.temp }}/qmarkdown-ci/*.log
            ${{ runner.temp }}/qmarkdown-ci/*.json
            ${{ runner.temp }}/qmarkdown-ci/*.txt
            ${{ runner.temp }}/qmarkdown-ci/os-release
            ${{ runner.temp }}/qmarkdown-ci/packaging/**/Testing/Temporary/*.log
            ${{ runner.temp }}/qmarkdown-ci/packaging/**/commonmark-report.json
            ${{ runner.temp }}/qmarkdown-ci/packaging/**/CMakeConfigureLog.yaml
            ${{ runner.temp }}/qmarkdown-ci/benchmarks/benchmark.json
            ${{ runner.temp }}/qmarkdown-ci/release-package/build/Testing/Temporary/*.log
            ${{ runner.temp }}/qmarkdown-ci/release-verification/**/CMakeConfigureLog.yaml
            ${{ runner.temp }}/qmarkdown-ci/release-real/**/CMakeConfigureLog.yaml
          retention-days: 14
      - name: Retain verified package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.qt }}
          path: ${{ runner.temp }}/qmarkdown-ci/release-package/*.tar.gz*
          if-no-files-found: error
          retention-days: 14
  binary-compatibility:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        qt: ['6.8.0', '6.11.3']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-6.8.0
          path: ${{ runner.temp }}/binary
      - name: Resolve toolchain identity
        id: toolchain
        env:
          CI_QT_VERSION: ${{ matrix.qt }}
        run: |
          mkdir -p "$RUNNER_TEMP/qmarkdown-image"
          date +%s > "$RUNNER_TEMP/qmarkdown-image/started.txt"
          python3 scripts/run-ci.py --qt "$CI_QT_VERSION" --image-metadata > "$RUNNER_TEMP/qmarkdown-image/metadata.json"
          python3 - "$RUNNER_TEMP/qmarkdown-image/metadata.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          for key, value in json.load(open(sys.argv[1])).items():
              print(f"{key}={value}")
          PY
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          # Bootstrap without the Docker Hub authentication endpoint.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Prepare toolchain image
        id: image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: scripts/ci-toolchain
          platforms: ${{ steps.toolchain.outputs.platform }}
          build-args: CI_QT_VERSION=${{ matrix.qt }}
          tags: ${{ steps.toolchain.outputs.tag }}
          load: true
          push: false
          cache-from: type=gha,version=2,scope=qmarkdown-qt-${{ matrix.qt }}-amd64
          cache-to: type=gha,version=2,scope=qmarkdown-qt-${{ matrix.qt }}-amd64,mode=max,ignore-error=true
      - name: Record hosted image preparation
        if: always()
        env:
          IMAGE_METADATA: ${{ steps.image.outputs.metadata }}
          IMAGE_ID: ${{ steps.image.outputs.imageid }}
          IMAGE_OUTCOME: ${{ steps.image.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/qmarkdown-image"
          python3 - "$RUNNER_TEMP/qmarkdown-image/build.json" <<'PY'
          import json, os, sys, time
          from pathlib import Path
          with open(sys.argv[1], "w") as output:
              evidence = {key: os.environ[key] for key in ("IMAGE_METADATA", "IMAGE_ID", "IMAGE_OUTCOME")}
              started = Path(sys.argv[1]).with_name("started.txt")
              if started.exists():
                  evidence["preparationSeconds"] = round(time.time() - float(started.read_text()), 3)
              json.dump(evidence, output, indent=2)
          PY
      - name: Consume the Qt 6.8 binary in a disposable container
        env:
          IMAGE_TAG: ${{ steps.toolchain.outputs.tag }}
          CI_QT_VERSION: ${{ matrix.qt }}
        run: |
          mkdir -p "$RUNNER_TEMP/binary-check"
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/binary,dst=/binary,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/binary-check,dst=/checks" \
            --env CI_QT_VERSION="$CI_QT_VERSION" "$IMAGE_TAG" bash -euc '
              export PATH="/opt/Qt/$CI_QT_VERSION/gcc_64/bin:$PATH"
              python3 /source/scripts/verify-release-package.py --archive /binary/*.tar.gz \
                --qt-root "/opt/Qt/$CI_QT_VERSION/gcc_64" --work-dir /checks/results --real-install
            ' 2>&1 | tee "$RUNNER_TEMP/binary-check/output.log"
      - name: Retain binary verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-check-${{ matrix.qt }}
          path: |
            ${{ runner.temp }}/binary-check/**
            ${{ runner.temp }}/qmarkdown-image/**
          retention-days: 14
  upload:
    needs: [build, binary-compatibility]
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-6.8.0
          path: release-assets
      - name: Upload identical or missing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 scripts/release/upload-assets.py --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --assets release-assets 2>&1 | tee "$RUNNER_TEMP/release-upload.log"
      - name: Retain upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-upload-failure
          path: |
            ${{ runner.temp }}/release-upload.log
            release-assets/*.sha256
          retention-days: 14
