version: '3'

tasks:
  sync-qt:
    desc: Synchronize development Qt with the selected host qmake before PR verification
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - python3 scripts/ci-toolchain/qt_versions.py --sync-host "{{.QMAKE | default "qmake6"}}"

  ci-minimum:
    desc: Run verification with the configured minimum Qt SDK
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - python3 scripts/run-ci.py --qt-role minimum

  ci-development:
    desc: Run verification with the configured development-host Qt SDK
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - python3 scripts/run-ci.py --qt-role development

  ci-6.8:
    desc: Alias for ci-minimum
    cmds:
      - task: ci-minimum

  build:
    desc: Configure and build the library, tests, and examples
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - cmake -S "." -B "build-shared" -DBUILD_TESTING=ON -DQMARKDOWN_BUILD_EXAMPLES=ON
      - cmake --build "build-shared" --parallel 2

  test:
    desc: Build and run the CTest suite
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - task: build
      - ctest --test-dir "build-shared" --output-on-failure

  demo:
    desc: Build and launch the editable Markdown playground
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - task: build
      - QML_IMPORT_PATH="{{.TASKFILE_DIR}}/build-shared/qml" "{{.TASKFILE_DIR}}/build-shared/examples/viewer/qmarkdown-viewer"

  demo-highlighted:
    desc: Build and launch the playground with syntax highlighting
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - cmake -S . -B build-highlighted -DQMARKDOWN_BUILD_EXAMPLES=ON -DQMARKDOWN_WITH_KSYNTAXHIGHLIGHTING=ON
      - cmake --build build-highlighted --target qmarkdown-viewer --parallel 2
      - QML_IMPORT_PATH="{{.TASKFILE_DIR}}/build-highlighted/qml" "{{.TASKFILE_DIR}}/build-highlighted/examples/viewer/qmarkdown-viewer"

  benchmark:
    desc: Run full advisory Release measurements and validate JSON
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - cmake -S . -B build-benchmarks -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DQMARKDOWN_BUILD_EXAMPLES=OFF -DQMARKDOWN_BUILD_BENCHMARKS=ON
      - cmake --build build-benchmarks --target qmarkdown-benchmark --parallel 2
      - QT_QPA_PLATFORM=offscreen QML_IMPORT_PATH="{{.TASKFILE_DIR}}/build-benchmarks/qml" timeout 600 build-benchmarks/tests/qmarkdown-benchmark > build-benchmarks/benchmark.json
      - python3 scripts/verify-benchmark.py build-benchmarks/benchmark.json
